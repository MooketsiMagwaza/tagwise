name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Lint, type-check, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Name gate
        run: npm run check:names
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  backend:
    name: Backend (fmt, clippy, test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests (database tests are ignored; see docs/BACKEND.md)
        run: cargo test --workspace

  compose:
    name: Compose files render and pass the guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Render the dev stack
        run: docker compose -f docker/compose.dev.yml config --quiet
      - name: Render the observability stack
        run: docker compose -f docker/observability/docker-compose.observability.yml config --quiet
      - name: Compose guard (labels, routes, networks, volumes, health checks)
        run: node docker/scripts/validate-compose.mjs

  docs-site:
    name: Docs site builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: docs-site/pnpm-lock.yaml
      - name: OpenAPI snapshot matches the services' routes
        run: node ../scripts/openapi-coverage.mjs && node --test ../scripts/openapi-coverage.test.mjs
      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Sync the Markdown and the API reference
        run: node scripts/sync-content.mjs && pnpm exec fumadocs-mdx
      - name: Build
        run: pnpm exec next build
      - name: Links in the published Markdown
        run: pnpm check:links

  register-db:
    name: Register database tests (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: tagwise
          POSTGRES_PASSWORD: tagwise
          POSTGRES_DB: tagwise_register
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgres://tagwise:tagwise@localhost:5432/tagwise_register
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Concurrency, idempotency, conflicts, isolation, scan classification
        run: cargo test -p tagwise-register --test register_db -- --ignored --test-threads=1
