# Serves the built single-page app: real files when they exist, otherwise
# index.html so deep links (/app/assets/MCT-00042) load the app.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header X-Content-Type-Options nosniff;
        try_files $uri $uri/ /index.html;
    }
}
