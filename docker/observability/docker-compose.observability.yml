name: tagwise-observability

# ─────────────────────────────────────────────────────────────────────────────
# Tagwise: metrics, dashboards and traces.
#
#   prometheus  scrapes the API's GET /metrics (HTTP counters + the
#               tagwise_up / tagwise_dependency_up / tagwise_build_info
#               gauges the metrics handler appends per scrape).
#   grafana     provisioned with Prometheus and Tempo datasources and the
#               "Tagwise — API & Health" dashboard (no manual setup).
#   otel-collector, tempo  receive and store traces (services send them
#               only with OTEL_ENABLED=true).
#
# It joins the dev stack's `tagwise-dev-app` network (start docker/compose.dev.yml
# first) and scrapes identity, register, notifications, media and ops by name,
# plus cAdvisor for container memory. The admin console reads Prometheus at
# http://tagwise-prometheus:9090 and Grafana at http://tagwise-grafana:3000.
#
# Usage:
#   docker compose -f docker/observability/docker-compose.observability.yml up -d
#   open http://localhost:3029   (admin / admin — change GF_SECURITY_ADMIN_PASSWORD)
#
# In production run this alongside docker-compose.prod.yml (or merge the two
# service sets) and lock Grafana down: real admin password, TLS at the proxy,
# and keep /metrics unreachable from the public internet.
# ─────────────────────────────────────────────────────────────────────────────

services:
  # Container memory and CPU for every container on the host. Prometheus
  # scrapes it; the admin console shows the tagwise-* containers.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: tagwise-cadvisor
    restart: unless-stopped
    command: ["--docker_only=true", "--housekeeping_interval=15s"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - default
      - tagwise-app
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: tagwise-prometheus
    restart: unless-stopped
    # The committed prometheus.yml has a `__API_TARGET__` placeholder; substitute
    # it at start so the scrape target is configurable without editing the file.
    entrypoint:
      - /bin/sh
      - -c
      - |
        sed "s#__API_TARGET__#$${TAGWISE_API_TARGET:-host.docker.internal:8080}#g" \
          /etc/prometheus/prometheus.yml > /prometheus/prometheus.runtime.yml
        exec /bin/prometheus \
          --config.file=/prometheus/prometheus.runtime.yml \
          --storage.tsdb.retention.time=15d \
          --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - default
      - tagwise-app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9096:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:13.2.1
    container_name: tagwise-grafana
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_DEFAULT_THEME: system
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/tagwise-api-health.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    networks:
      - default
      - tagwise-app
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GF_PORT:-3029}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Traces: services send spans over OTLP to the collector (only when
  # OTEL_ENABLED=true), which forwards them to Tempo; Grafana reads Tempo.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    container_name: tagwise-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol/collector.yaml"]
    volumes:
      - ./otel/collector.yaml:/etc/otelcol/collector.yaml:ro
    networks:
      - default
      - tagwise-app
    depends_on:
      - tempo

  tempo:
    image: grafana/tempo:2.6.1
    container_name: tagwise-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    networks:
      - default

networks:
  # The dev stack's app network, created by docker/compose.dev.yml.
  tagwise-app:
    name: tagwise-dev-app
    external: true

volumes:
  prometheus_data:
  grafana_data:
  tempo_data:
